<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重設密碼 — SmartJournal AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C9A84C;--dark:#0A0C0F;--dark2:#111418;--dark3:#181D24;--border:rgba(201,168,76,0.2);--border-dim:rgba(255,255,255,0.06);--green:#00D68F;--red:#FF4D6A;--text:#E8E3D8;--muted:#7A8494;}
body{background:var(--dark);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.box{background:var(--dark2);border:0.5px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px;}
.logo{font-family:'Space Mono',monospace;font-size:15px;color:var(--gold);margin-bottom:8px;}
.logo span{color:var(--text);opacity:0.5;}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:28px;}
.fl{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:0.06em;display:block;margin-bottom:8px;}
.fi{width:100%;background:var(--dark3);border:0.5px solid var(--border-dim);color:var(--text);padding:12px 16px;border-radius:6px;font-size:14px;outline:none;transition:border-color 0.2s;margin-bottom:16px;}
.fi:focus{border-color:var(--gold);}
.fi::placeholder{color:var(--muted);}
.btn{width:100%;padding:14px;background:var(--gold);color:var(--dark);border:none;border-radius:6px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
.btn:hover{opacity:0.9;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.msg{font-size:13px;margin-top:12px;text-align:center;line-height:1.6;}
.back{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--muted);text-decoration:none;}
.back:hover{color:var(--text);}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Smart<span>Journal</span> AI</div>

  <!-- 忘記密碼 -->
  <div id="forgotSection">
    <div class="subtitle">輸入你的 Email，我們會寄送重設連結</div>
    <label class="fl">EMAIL</label>
    <input class="fi" type="email" id="forgotEmail" placeholder="your@email.com">
    <div class="msg" id="forgotMsg"></div>
    <button class="btn" id="forgotBtn" onclick="sendReset()">寄送重設連結</button>
    <a href="index.html" class="back">← 返回登入</a>
  </div>

  <!-- 重設密碼 -->
  <div id="resetSection" style="display:none;">
    <div class="subtitle">設定你的新密碼</div>
    <label class="fl">新密碼（最少 8 字元）</label>
    <input class="fi" type="password" id="newPassword" placeholder="••••••••">
    <label class="fl">確認新密碼</label>
    <input class="fi" type="password" id="confirmPassword" placeholder="••••••••">
    <div class="msg" id="resetMsg"></div>
    <button class="btn" id="resetBtn" onclick="doReset()">重設密碼</button>
  </div>
</div>

<script>
const API = 'https://web-production-6cef6.up.railway.app/api/v1';

// 檢查網址有沒有 token
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (token) {
  document.getElementById('forgotSection').style.display = 'none';
  document.getElementById('resetSection').style.display = 'block';
}

async function sendReset() {
  const email = document.getElementById('forgotEmail').value.trim();
  const msgEl = document.getElementById('forgotMsg');
  const btn = document.getElementById('forgotBtn');

  if (!email) { msgEl.innerHTML = '<span style="color:var(--red)">請輸入 Email</span>'; return; }

  btn.disabled = true; btn.textContent = '寄送中...';
  try {
    const res = await fetch(`${API}/password/forgot`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    msgEl.innerHTML = `<span style="color:var(--green)">✅ ${data.message}</span>`;
  } catch(e) {
    msgEl.innerHTML = '<span style="color:var(--red)">發生錯誤，請稍後再試</span>';
  }
  btn.disabled = false; btn.textContent = '寄送重設連結';
}

async function doReset() {
  const newPw = document.getElementById('newPassword').value;
  const confirmPw = document.getElementById('confirmPassword').value;
  const msgEl = document.getElementById('resetMsg');
  const btn = document.getElementById('resetBtn');

  if (newPw.length < 8) { msgEl.innerHTML = '<span style="color:var(--red)">密碼至少 8 個字元</span>'; return; }
  if (newPw !== confirmPw) { msgEl.innerHTML = '<span style="color:var(--red)">兩次密碼不一致</span>'; return; }

  btn.disabled = true; btn.textContent = '重設中...';
  try {
    const res = await fetch(`${API}/password/reset`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token, new_password: newPw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    msgEl.innerHTML = `<span style="color:var(--green)">✅ ${data.message}</span>`;
    setTimeout(() => window.location.href = 'index.html', 2000);
  } catch(e) {
    msgEl.innerHTML = `<span style="color:var(--red)">${e.message}</span>`;
  }
  btn.disabled = false; btn.textContent = '重設密碼';
}
</script>
</body>
</html>
