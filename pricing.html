<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>升級方案 — SmartJournal AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#C9A84C;--dark:#0A0C0F;--dark2:#111418;--dark3:#181D24;--dark4:#1E252F;
  --border:rgba(201,168,76,0.2);--border-dim:rgba(255,255,255,0.06);
  --green:#00D68F;--red:#FF4D6A;--text:#E8E3D8;--muted:#7A8494;
}
body{background:var(--dark);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

.logo{font-family:'Space Mono',monospace;font-size:15px;color:var(--gold);margin-bottom:40px;text-align:center;}
.logo span{color:var(--text);opacity:0.5;}

.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;width:100%;margin-bottom:32px;}
.plan{background:var(--dark2);border:0.5px solid var(--border-dim);border-radius:12px;padding:28px;cursor:pointer;transition:all 0.2s;position:relative;}
.plan:hover{border-color:var(--border);transform:translateY(-2px);}
.plan.selected{border-color:var(--gold);background:var(--dark3);}
.plan-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--dark);font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:3px 14px;border-radius:100px;white-space:nowrap;}
.plan-name{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.12em;margin-bottom:12px;}
.plan-price{font-family:'Space Mono',monospace;font-size:36px;font-weight:700;margin-bottom:4px;}
.plan-price.gold{color:var(--gold);}
.plan-period{font-size:12px;color:var(--muted);margin-bottom:16px;}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:7px;}
.plan-features li{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.plan-features li::before{content:'▸';color:var(--gold);font-size:9px;}
.plan-features li.on{color:var(--text);}

.currency-selector{display:flex;gap:8px;margin-bottom:24px;justify-content:center;}
.cur-btn{background:var(--dark3);border:0.5px solid var(--border-dim);color:var(--muted);padding:8px 20px;border-radius:6px;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;transition:all 0.2s;}
.cur-btn:hover{border-color:var(--border);color:var(--text);}
.cur-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.08);}

.pay-btn{background:var(--gold);color:var(--dark);border:none;padding:14px 40px;border-radius:6px;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;width:100%;max-width:600px;}
.pay-btn:hover{opacity:0.9;}
.pay-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* PAYMENT MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--dark2);border:0.5px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:440px;position:relative;}
.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
.modal-title{font-family:'Space Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:0.1em;margin-bottom:24px;}

.pay-info{background:var(--dark3);border:0.5px solid var(--border-dim);border-radius:10px;padding:20px;margin-bottom:16px;}
.pay-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.pay-row:last-child{margin-bottom:0;}
.pay-label{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
.pay-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.pay-val.gold{color:var(--gold);}
.pay-val.green{color:var(--green);}

.address-box{background:var(--dark4);border:0.5px solid var(--border-dim);border-radius:8px;padding:14px 16px;margin-bottom:16px;word-break:break-all;font-family:'Space Mono',monospace;font-size:11px;color:var(--text);position:relative;}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--dark3);border:0.5px solid var(--border-dim);color:var(--muted);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:'Space Mono',monospace;transition:all 0.2s;}
.copy-btn:hover{color:var(--text);}
.copy-btn.copied{color:var(--green);border-color:var(--green);}

.qr-area{display:flex;justify-content:center;margin-bottom:16px;}
.qr-placeholder{width:120px;height:120px;background:var(--dark4);border:0.5px solid var(--border-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;}

.status-bar{background:var(--dark3);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.status-dot.paid{background:var(--green);animation:none;}

.note{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;}

.back-link{font-size:12px;color:var(--muted);text-decoration:none;text-align:center;display:block;margin-top:24px;transition:color 0.2s;}
.back-link:hover{color:var(--text);}

.loading-spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:var(--dark);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="logo">Smart<span>Journal</span> AI<br><span style="font-size:11px;color:var(--muted);">升級你的方案</span></div>

<div class="plans">
  <div class="plan" id="plan-pro" onclick="selectPlan('pro')">
    <div class="plan-name">PRO</div>
    <div class="plan-price gold">$19</div>
    <div class="plan-period">/ 月 · USDT</div>
    <ul class="plan-features">
      <li class="on">無限交易紀錄</li>
      <li class="on">SMC 策略分析</li>
      <li class="on">AI 診斷報告</li>
      <li class="on">週報 PDF 匯出</li>
    </ul>
  </div>
  <div class="plan" id="plan-whale" onclick="selectPlan('whale')">
    <div class="plan-badge">進階</div>
    <div class="plan-name">WHALE</div>
    <div class="plan-price" style="color:var(--text)">$49</div>
    <div class="plan-period">/ 月 · USDT</div>
    <ul class="plan-features">
      <li class="on">Pro 所有功能</li>
      <li class="on">高頻 Webhook</li>
      <li class="on">一對一風控診斷</li>
      <li class="on">優先客服</li>
    </ul>
  </div>
</div>

<div style="margin-bottom:16px;text-align:center;font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;">選擇付款幣種</div>
<div class="currency-selector">
  <button class="cur-btn active" onclick="selectCurrency('USDT',this)">USDT</button>
  <button class="cur-btn" onclick="selectCurrency('BTC',this)">BTC</button>
  <button class="cur-btn" onclick="selectCurrency('ETH',this)">ETH</button>
  <button class="cur-btn" onclick="selectCurrency('BNB',this)">BNB</button>
</div>

<button class="pay-btn" id="payBtn" onclick="startPayment()">選擇方案後付款</button>
<a href="dashboard.html" class="back-link">← 返回儀表板</a>

<!-- PAYMENT MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">CRYPTO PAYMENT</div>

    <div class="pay-info">
      <div class="pay-row">
        <span class="pay-label">方案</span>
        <span class="pay-val" id="modalPlan">—</span>
      </div>
      <div class="pay-row">
        <span class="pay-label">應付金額</span>
        <span class="pay-val gold" id="modalAmount">—</span>
      </div>
      <div class="pay-row">
        <span class="pay-label">幣種</span>
        <span class="pay-val" id="modalCurrency">—</span>
      </div>
    </div>

    <div style="font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;margin-bottom:8px;">付款地址</div>
    <div class="address-box" id="payAddress">
      載入中...
      <button class="copy-btn" id="copyBtn" onclick="copyAddress()">複製</button>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">等待付款中...</span>
    </div>

    <p class="note">請在 60 分鐘內完成付款。付款確認後方案將自動升級。<br>如有問題請聯繫客服。</p>
  </div>
</div>

<script>
const API = 'https://web-production-6cef6.up.railway.app/api/v1';
const token = localStorage.getItem('sj_token');

if (!token) window.location.href = 'index.html';

let selectedPlan = null;
let selectedCurrency = 'USDT';
let currentPaymentId = null;
let statusInterval = null;

function selectPlan(plan) {
  selectedPlan = plan;
  document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
  document.getElementById(`plan-${plan}`).classList.add('selected');
  document.getElementById('payBtn').textContent = `用 ${selectedCurrency} 付款 ${plan === 'pro' ? '$19' : '$49'} →`;
}

function selectCurrency(cur, btn) {
  selectedCurrency = cur;
  document.querySelectorAll('.cur-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (selectedPlan) {
    document.getElementById('payBtn').textContent = `用 ${cur} 付款 ${selectedPlan === 'pro' ? '$19' : '$49'} →`;
  }
}

async function startPayment() {
  if (!selectedPlan) {
    alert('請先選擇方案');
    return;
  }

  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spin"></span>建立付款中...';

  try {
    const res = await fetch(`${API}/payments/create?plan=${selectedPlan}&currency=${selectedCurrency}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '建立失敗');

    currentPaymentId = data.payment_id;
    showPaymentModal(data);
    startStatusCheck();

  } catch(e) {
    alert('建立付款失敗：' + e.message);
  }

  btn.disabled = false;
  btn.textContent = `用 ${selectedCurrency} 付款 ${selectedPlan === 'pro' ? '$19' : '$49'} →`;
}

function showPaymentModal(data) {
  document.getElementById('modalPlan').textContent = data.plan.toUpperCase();
  document.getElementById('modalAmount').textContent = `${data.pay_amount} ${data.pay_currency.toUpperCase()}`;
  document.getElementById('modalCurrency').textContent = data.pay_currency.toUpperCase();
  document.getElementById('payAddress').childNodes[0].textContent = data.pay_address;
  document.getElementById('overlay').classList.add('open');
}

function copyAddress() {
  const addr = document.getElementById('payAddress').childNodes[0].textContent.trim();
  navigator.clipboard.writeText(addr);
  const btn = document.getElementById('copyBtn');
  btn.textContent = '已複製 ✓';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
}

function startStatusCheck() {
  if (statusInterval) clearInterval(statusInterval);
  statusInterval = setInterval(checkStatus, 10000);
}

async function checkStatus() {
  if (!currentPaymentId) return;
  try {
    const res = await fetch(`${API}/payments/status/${currentPaymentId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    const status = data.payment_status;

    if (status === 'finished' || status === 'confirmed') {
      document.getElementById('statusDot').classList.add('paid');
      document.getElementById('statusText').textContent = '✅ 付款成功！方案已升級';
      clearInterval(statusInterval);
      setTimeout(() => window.location.href = 'dashboard.html', 3000);
    } else if (status === 'partially_paid') {
      document.getElementById('statusText').textContent = '部分付款，請補足金額';
    } else if (status === 'expired') {
      document.getElementById('statusText').textContent = '付款已過期，請重新建立';
      clearInterval(statusInterval);
    }
  } catch(e) {}
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  if (statusInterval) clearInterval(statusInterval);
}

function handleOverlay(e) {
  if (e.target === e.currentTarget) closeModal();
}
</script>
</body>
</html>
